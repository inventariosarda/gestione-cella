  <script type="module">
        // ── Firebase imports ──────────────────────────────────────────────────────
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, Timestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0daUTnfyhdyWPpkmFoPcyAguyZq63NE0",
            authDomain: "gestionepedane.firebaseapp.com",
            projectId: "gestionepedane",
            storageBucket: "gestionepedane.firebasestorage.app",
            messagingSenderId: "865581696674",
            appId: "1:865581696674:web:876ac3f6c5b34e1ccd39fb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        const DEVICE_ID = 'D-' + Math.floor(Math.random() * 1000);

        // ── State ─────────────────────────────────────────────────────────────────
        let tipoMovimento = 'ENTRATA';
        let prodotti = [];
        let giacenze = [];
        let lottoSelezionatoUscita = null;
        let confermaCallback = null;
        let isOnline = navigator.onLine;

        // ── IndexedDB setup ───────────────────────────────────────────────────────
        const DB_NAME = 'GestionePedaneDB';
        const DB_VERSION = 2;
        let idb = null;

        function openIDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('prodotti')) db.createObjectStore('prodotti', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('giacenze')) db.createObjectStore('giacenze', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('opQueue')) db.createObjectStore('opQueue', { keyPath: 'opId' });
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function idbAll(storeName) {
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(storeName, 'readonly');
                const req = tx.objectStore(storeName).getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function idbPut(storeName, item) {
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(storeName, 'readwrite');
                const req = tx.objectStore(storeName).put(item);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function idbDelete(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(storeName, 'readwrite');
                const req = tx.objectStore(storeName).delete(key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function idbClear(storeName) {
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(storeName, 'readwrite');
                const req = tx.objectStore(storeName).clear();
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function genOpId() {
            return 'op-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        }

        // ── Queue management ──────────────────────────────────────────────────────
        async function enqueueOp(op) {
            op.opId = op.opId || genOpId();
            op.createdAt = op.createdAt || Date.now();
            await idbPut('opQueue', op);
            updateSyncBadge();
        }

        async function dequeueOp(opId) {
            await idbDelete('opQueue', opId);
            updateSyncBadge();
        }

        async function updateSyncBadge() {
            const queue = await idbAll('opQueue');
            const badge = document.getElementById('sync-badge');
            if (queue.length > 0) {
                badge.textContent = `⏳ ${queue.length} in attesa`;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // ── Connection status ─────────────────────────────────────────────────────
        function updateConnectionUI() {
            const el = document.getElementById('connection-status');
            if (isOnline) {
                el.textContent = '🟢 Connesso al Cloud';
            } else {
                el.textContent = '🔴 Offline — dati salvati localmente';
            }
        }

        window.addEventListener('online', async () => {
            isOnline = true;
            updateConnectionUI();
            await syncQueue();
        });

        window.addEventListener('offline', () => {
            isOnline = false;
            updateConnectionUI();
        });

        // ── Sync queue to Firestore ───────────────────────────────────────────────
        let isSyncing = false;

        async function syncQueue() {
            if (isSyncing) return;
            isSyncing = true;
            try {
                const queue = await idbAll('opQueue');
                for (const op of queue) {
                    try {
                        await executeOp(op);
                        await dequeueOp(op.opId);
                    } catch (err) {
                        console.warn('Sync error for op', op.opId, err);
                    }
                }
            } finally {
                isSyncing = false;
                updateSyncBadge();
            }
        }

        async function executeOp(op) {
            switch (op.type) {
                case 'addProdotto': {
                    // Check if already exists in Firestore (avoid dup)
                    const exists = prodotti.find(p => p._localId === op.localId);
                    if (exists && exists._synced) break;
                    const ref = await addDoc(collection(db, 'prodotti'), { nome: op.nome });
                    // Update local IDB: replace localId with real id
                    await idbDelete('prodotti', op.localId);
                    await idbPut('prodotti', { id: ref.id, nome: op.nome, _synced: true });
                    break;
                }
                case 'updateProdotto':
                    await updateDoc(doc(db, 'prodotti', op.id), { nome: op.nome });
                    break;
                case 'deleteProdotto':
                    try { await deleteDoc(doc(db, 'prodotti', op.id)); } catch(e) {}
                    break;
                case 'addGiacenza': {
                    const ref = await addDoc(collection(db, 'giacenze'), op.dati);
                    await idbDelete('giacenze', op.localId);
                    await idbPut('giacenze', { ...op.dati, id: ref.id, _synced: true });
                    break;
                }
                case 'updateGiacenza':
                    await updateDoc(doc(db, 'giacenze', op.id), op.dati);
                    break;
                case 'deleteGiacenza':
                    try { await deleteDoc(doc(db, 'giacenze', op.id)); } catch(e) {}
                    break;
                case 'addEvento':
                    await addDoc(collection(db, 'eventi'), { ...op.dati, timestamp: Timestamp.now(), deviceId: DEVICE_ID });
                    break;
            }
        }

        // ── Local-first helpers ───────────────────────────────────────────────────
        function genLocalId() {
            return 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        }

        function isLocalId(id) {
            return id && id.startsWith('local-');
        }

        async function localAddProdotto(nome) {
            const localId = genLocalId();
            const item = { id: localId, nome, _synced: false };
            prodotti.push(item);
            await idbPut('prodotti', item);
            return localId;
        }

        async function localUpdateProdotto(id, nome) {
            const idx = prodotti.findIndex(p => p.id === id);
            if (idx >= 0) { prodotti[idx].nome = nome; await idbPut('prodotti', prodotti[idx]); }
        }

        async function localDeleteProdotto(id) {
            prodotti = prodotti.filter(p => p.id !== id);
            await idbDelete('prodotti', id);
        }

        async function localAddGiacenza(dati) {
            const localId = genLocalId();
            const item = { ...dati, id: localId, _synced: false };
            giacenze.push(item);
            await idbPut('giacenze', item);
            return localId;
        }

        async function localUpdateGiacenza(id, dati) {
            const idx = giacenze.findIndex(g => g.id === id);
            if (idx >= 0) {
                giacenze[idx] = { ...giacenze[idx], ...dati };
                await idbPut('giacenze', giacenze[idx]);
            }
        }

        async function localDeleteGiacenza(id) {
            giacenze = giacenze.filter(g => g.id !== id);
            await idbDelete('giacenze', id);
        }

        // ── UI helpers ────────────────────────────────────────────────────────────
        function mostraMessaggio(testo) {
            document.getElementById('modal-messaggio-testo').innerText = testo;
            document.getElementById('modal-messaggio').classList.remove('hidden');
        }

        window.chiudiModalMessaggio = () => {
            document.getElementById('modal-messaggio').classList.add('hidden');
        };

        function mostraConferma(testo) {
            return new Promise(resolve => {
                confermaCallback = resolve;
                document.getElementById('modal-conferma-testo').innerText = testo;
                document.getElementById('modal-conferma').classList.remove('hidden');
            });
        }

        window.chiudiModalConferma = (esito) => {
            document.getElementById('modal-conferma').classList.add('hidden');
            if (confermaCallback) confermaCallback(esito);
            confermaCallback = null;
        };

        function mostraNotifica(m) { mostraMessaggio(m); }

        function formattaData(dataStringa) {
            if (!dataStringa) return "";
            const soloData = dataStringa.split('T')[0];
            const parti = soloData.split('-');
            if (parti.length === 3) return `${parti[2]}-${parti[1]}-${parti[0]}`;
            return dataStringa;
        }

        // ── Firebase listeners ────────────────────────────────────────────────────
        function startFirebaseListeners() {
            onSnapshot(collection(db, "prodotti"), async (snap) => {
                const serverProdotti = snap.docs.map(d => ({ ...d.data(), id: d.id, _synced: true }));
                // Merge: keep local-only items not yet synced
                const localOnly = prodotti.filter(p => isLocalId(p.id));
                prodotti = [...serverProdotti, ...localOnly];
                // Persist to IDB
                await idbClear('prodotti');
                for (const p of prodotti) await idbPut('prodotti', p);
                updateSelectProdotti();
                renderSetup();
                renderGiacenze();
                aggiornaVistaOUT();
                if (document.getElementById('section-inventario').classList.contains('active')) renderInventario();
            });

            onSnapshot(collection(db, "giacenze"), async (snap) => {
                const serverGiacenze = snap.docs.map(d => ({ ...d.data(), id: d.id, _synced: true }));
                const localOnly = giacenze.filter(g => isLocalId(g.id));
                giacenze = [...serverGiacenze, ...localOnly];
                await idbClear('giacenze');
                for (const g of giacenze) await idbPut('giacenze', g);
                renderGiacenze();
                aggiornaVistaOUT();
                if (document.getElementById('section-inventario').classList.contains('active')) renderInventario();
            });
        }

        // ── Init ──────────────────────────────────────────────────────────────────
        window.onload = async () => {
            idb = await openIDB();

            // Load from local first
            prodotti = await idbAll('prodotti');
            giacenze = await idbAll('giacenze');

            updateConnectionUI();
            updateSelectProdotti();
            renderSetup();
            renderGiacenze();
            aggiornaVistaOUT();
            await updateSyncBadge();

            // Start Firebase sync
            try {
                startFirebaseListeners();
            } catch(e) {
                console.warn('Firebase unavailable, running offline');
            }

            // If online, sync pending ops
            if (isOnline) {
                await syncQueue();
            }

            // Periodic retry every 30s
            setInterval(async () => {
                if (isOnline) await syncQueue();
            }, 30000);
        };

        // ── Tab navigation ────────────────────────────────────────────────────────
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
            document.getElementById(`section-${tabId}`).classList.add('active');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(`nav-${tabId}`).classList.add('active-tab');
            if (tabId === 'inventario') renderInventario();
        }

        window.switchTab = switchTab;

        // ── Tipo movimento ────────────────────────────────────────────────────────
        window.setTipoMovimento = (t) => {
            tipoMovimento = t;
            lottoSelezionatoUscita = null;
            document.getElementById('btn-tipo-entrata').className = (t === 'ENTRATA')
                ? "py-3 rounded-lg font-bold border-2 border-green-600 bg-green-50 text-green-700"
                : "py-3 rounded-lg font-bold border-2 border-gray-300 text-gray-500";
            document.getElementById('btn-tipo-uscita').className = (t === 'USCITA')
                ? "py-3 rounded-lg font-bold border-2 border-red-600 bg-red-50 text-red-700"
                : "py-3 rounded-lg font-bold border-2 border-gray-300 text-gray-500";
            document.getElementById('container-carico-manuale').classList.toggle('hidden', t === 'USCITA');
            document.getElementById('container-scarico-lotti').classList.toggle('hidden', t === 'ENTRATA');
            aggiornaVistaOUT();
        };

        // ── Select prodotti ───────────────────────────────────────────────────────
        function updateSelectProdotti() {
            const sel = document.getElementById('mov-prodotto');
            if (prodotti.length === 0) {
                sel.innerHTML = '<option value="">Nessun prodotto</option>';
                return;
            }
            sel.innerHTML = prodotti.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
        }

        // ── Vista OUT ─────────────────────────────────────────────────────────────
        function aggiornaVistaOUT() {
            if (prodotti.length === 0) return;
            const pid = document.getElementById('mov-prodotto').value;
            const cont = document.getElementById('lista-lotti-prelievo');
            const lotti = giacenze.filter(g => g.idProdotto === pid && g.quantita > 0);

            if (lotti.length === 0) {
                cont.innerHTML = '<p class="text-center text-gray-500 text-sm py-4">Nessun lotto disponibile</p>';
                lottoSelezionatoUscita = null;
                return;
            }

            cont.innerHTML = lotti.map(g => `
                <div onclick="selezionaLottoUscita('${g.id}')" id="lotto-row-${g.id}"
                     class="bg-gray-50 p-3 rounded-lg flex justify-between items-center border cursor-pointer ${lottoSelezionatoUscita === g.id ? 'border-red-600 bg-red-50 ring-2 ring-red-300' : ''}">
                    <div>
                        <span class="font-bold">LOTTO ${g.lotto}</span><br>
                        <small class="text-gray-500">Scad: ${formattaData(g.scadenza)}</small>
                    </div>
                    <span class="font-bold text-red-700">${g.quantita} pedane</span>
                </div>
            `).join('');
        }

        window.aggiornaVistaOUT = aggiornaVistaOUT;

        // ── Selezione lotto uscita ────────────────────────────────────────────────
        window.selezionaLottoUscita = (id) => {
            const g = giacenze.find(x => x.id === id);
            if (!g) return;
            lottoSelezionatoUscita = id;
            aggiornaVistaOUT();
            document.getElementById('modal-uscita-lotto-info').innerText = `${g.nome} — LOTTO ${g.lotto} (Scad: ${g.scadenza})`;
            document.getElementById('modal-uscita-disponibili').innerText = `Disponibili: ${g.quantita} pedane`;
            const inputQta = document.getElementById('modal-uscita-quantita');
            inputQta.value = "1";
            inputQta.max = g.quantita;
            document.getElementById('modal-uscita-lotto').classList.remove('hidden');
        };

        window.chiudiModalUscita = () => {
            document.getElementById('modal-uscita-lotto').classList.add('hidden');
            lottoSelezionatoUscita = null;
            aggiornaVistaOUT();
        };

        window.confermaUscita = async () => {
            if (!lottoSelezionatoUscita) return mostraNotifica("Seleziona un lotto");
            const g = giacenze.find(x => x.id === lottoSelezionatoUscita);
            if (!g) return mostraNotifica("Lotto non trovato");
            const qta = parseInt(document.getElementById('modal-uscita-quantita').value);
            if (!qta || qta < 1) return mostraNotifica("Quantità non valida");
            if (qta > g.quantita) return mostraNotifica(`Disponibili solo ${g.quantita} pedane`);

            const nuovaQta = g.quantita - qta;

            if (nuovaQta <= 0) {
                await localDeleteGiacenza(g.id);
                if (isOnline && !isLocalId(g.id)) {
                    await deleteDoc(doc(db, "giacenze", g.id));
                } else if (!isLocalId(g.id)) {
                    await enqueueOp({ type: 'deleteGiacenza', id: g.id });
                }
            } else {
                await localUpdateGiacenza(g.id, { quantita: nuovaQta });
                if (isOnline && !isLocalId(g.id)) {
                    await updateDoc(doc(db, "giacenze", g.id), { quantita: nuovaQta });
                } else if (!isLocalId(g.id)) {
                    await enqueueOp({ type: 'updateGiacenza', id: g.id, dati: { quantita: nuovaQta } });
                }
            }

            const eventoData = {
                tipo: 'USCITA', idProdotto: g.idProdotto, nomeProdotto: g.nome,
                lotto: g.lotto, scadenza: g.scadenza, quantita: qta, giacenzaId: g.id
            };
            if (isOnline) {
                await addDoc(collection(db, "eventi"), { ...eventoData, timestamp: Timestamp.now(), deviceId: DEVICE_ID });
            } else {
                await enqueueOp({ type: 'addEvento', dati: eventoData });
            }

            chiudiModalUscita();
            mostraNotifica(`Uscite ${qta} pedane`);
            renderGiacenze();
            aggiornaVistaOUT();
            if (document.getElementById('section-inventario').classList.contains('active')) renderInventario();
        };

        // ── Registra movimento (ENTRATA) ──────────────────────────────────────────
        async function registraMovimento() {
            const pid = document.getElementById('mov-prodotto').value;
            const p = prodotti.find(x => x.id === pid);
            if (!p) return mostraNotifica("Seleziona un prodotto");

            const lotto = document.getElementById('mov-lotto').value.trim().toUpperCase();
            const scad = document.getElementById('mov-scadenza').value;
            const qta = parseInt(document.getElementById('mov-quantita').value);
            if (!lotto || !scad || !qta) return mostraNotifica("Compila tutto");

            const esistente = giacenze.find(g => g.idProdotto === pid && g.lotto === lotto && g.scadenza === scad);
            let giacenzaId;

            if (esistente) {
                const nuovaQta = esistente.quantita + qta;
                await localUpdateGiacenza(esistente.id, { quantita: nuovaQta });
                giacenzaId = esistente.id;
                if (isOnline && !isLocalId(esistente.id)) {
                    await updateDoc(doc(db, "giacenze", esistente.id), { quantita: nuovaQta });
                } else if (!isLocalId(esistente.id)) {
                    await enqueueOp({ type: 'updateGiacenza', id: esistente.id, dati: { quantita: nuovaQta } });
                }
            } else {
                const dati = { idProdotto: pid, nome: p.nome, lotto, scadenza: scad, quantita: qta };
                const localId = await localAddGiacenza(dati);
                giacenzaId = localId;
                if (isOnline && !isLocalId(pid)) {
                    const ref = await addDoc(collection(db, "giacenze"), dati);
                    await idbDelete('giacenze', localId);
                    giacenze = giacenze.filter(g => g.id !== localId);
                    const newG = { ...dati, id: ref.id, _synced: true };
                    giacenze.push(newG);
                    await idbPut('giacenze', newG);
                    giacenzaId = ref.id;
                } else {
                    await enqueueOp({ type: 'addGiacenza', localId, dati });
                }
            }

            const eventoData = { tipo: 'ENTRATA', idProdotto: pid, nomeProdotto: p.nome, lotto, scadenza: scad, quantita: qta, giacenzaId };
            if (isOnline) {
                await addDoc(collection(db, "eventi"), { ...eventoData, timestamp: Timestamp.now(), deviceId: DEVICE_ID });
            } else {
                await enqueueOp({ type: 'addEvento', dati: eventoData });
            }

            mostraNotifica(isOnline ? "Registrato!" : "Salvato offline ✓");
            document.getElementById('mov-quantita').value = "1";
            document.getElementById('mov-lotto').value = "";
            document.getElementById('mov-scadenza').value = "";
            renderGiacenze();
            aggiornaVistaOUT();
            if (document.getElementById('section-inventario').classList.contains('active')) renderInventario();
        }

        window.registraMovimento = registraMovimento;

        // ── Render Giacenze ───────────────────────────────────────────────────────
        function renderGiacenze() {
            const cont = document.getElementById('giacenza-lista');
            if (prodotti.length === 0) {
                cont.innerHTML = '<p class="text-center text-gray-500 py-8">Nessun prodotto registrato</p>';
                return;
            }
            const html = prodotti.map(p => {
                const lotti = giacenze
                    .filter(g => g.idProdotto === p.id && g.quantita > 0)
                    .sort((a, b) => new Date(a.scadenza) - new Date(b.scadenza));
                const totale = lotti.reduce((s, g) => s + g.quantita, 0);
                const badgeClass = totale > 0 ? 'bg-green-600 text-white' : 'bg-gray-400 text-white';
                return `
                    <div class="bg-white p-4 rounded-xl shadow mb-3">
                        <div class="flex justify-between items-center border-b pb-2 mb-2">
                            <h3 class="font-bold text-blue-900">${p.nome}</h3>
                            <span class="${badgeClass} font-bold px-3 py-1 rounded-lg text-sm">${totale} pedane</span>
                        </div>
                        ${lotti.length > 0 ? `
                            <div class="grid grid-cols-3 gap-2 text-xs font-bold text-gray-500 border-b pb-1 mb-1">
                                <span>Lotto</span><span>Scadenza</span><span class="text-right">Pedane</span>
                            </div>
                            ${lotti.map(g => `
                                <div class="grid grid-cols-3 gap-2 py-2 text-sm border-b border-gray-100 last:border-0">
                                    <span class="font-bold">${g.lotto}</span>
                                    <span class="text-gray-600">${formattaData(g.scadenza)}</span>
                                    <span class="font-bold text-right">${g.quantita}</span>
                                </div>
                            `).join('')}
                        ` : '<p class="text-sm text-gray-400 py-2">Nessun lotto in giacenza</p>'}
                    </div>`;
            }).join('');
            cont.innerHTML = html;
        }

        window.renderGiacenze = renderGiacenze;

        // ── Render Inventario ─────────────────────────────────────────────────────
        function renderInventario() {
            const cont = document.getElementById('inventario-container');
            if (prodotti.length === 0) {
                cont.innerHTML = '<p class="text-center text-gray-500 py-8">Aggiungi prodotti in Setup</p>';
                return;
            }
            cont.innerHTML = prodotti.map(p => {
                const lotti = giacenze.filter(g => g.idProdotto === p.id);
                const totale = lotti.reduce((s, g) => s + (g.quantita || 0), 0);
                return `
                    <div class="bg-white p-4 rounded-xl shadow">
                        <div class="flex justify-between items-center border-b mb-3 pb-2">
                            <h3 class="font-bold text-blue-900">${p.nome}</h3>
                            <span class="font-bold text-sm text-gray-700">${totale} pedane</span>
                        </div>
                        <div id="inv-lotti-${p.id}" class="space-y-2">
                            ${lotti.length === 0
                                ? '<p class="text-sm text-gray-400">Nessun lotto — aggiungine uno</p>'
                                : lotti.map(g => `
                                    <div class="flex items-center gap-2">
                                        <div onclick="apriModalInventarioLotto('${g.id}', '${p.id}')"
                                             class="flex-1 bg-gray-50 border border-gray-200 rounded-lg p-3 cursor-pointer active:bg-gray-100">
                                            <span class="text-sm"><span class="font-bold">${g.lotto}</span> · Scad: ${formattaData(g.scadenza)} · <span class="font-bold">${g.quantita}</span> ped.</span>
                                        </div>
                                        <button onclick="event.stopPropagation(); eliminaRigaInventario('${g.id}')"
                                                class="text-red-600 font-bold text-xl w-9 h-9 flex-shrink-0 flex items-center justify-center rounded-lg hover:bg-red-50" title="Elimina">✕</button>
                                    </div>
                                `).join('')}
                        </div>
                        <button onclick="apriModalInventarioLotto(null, '${p.id}')" class="mt-3 w-full py-2 border-2 border-dashed border-blue-300 text-blue-700 rounded-lg text-sm font-bold">+ Aggiungi lotto</button>
                    </div>`;
            }).join('');
        }

        window.renderInventario = renderInventario;

        // ── Modal inventario lotto ────────────────────────────────────────────────
        window.apriModalInventarioLotto = (giacenzaId, prodottoId) => {
            const p = prodotti.find(x => x.id === prodottoId);
            if (!p) return;
            document.getElementById('modal-inv-giacenza-id').value = giacenzaId || '';
            document.getElementById('modal-inv-prodotto-id').value = prodottoId;
            document.getElementById('modal-inv-prodotto-nome').innerText = p.nome;
            if (giacenzaId) {
                const g = giacenze.find(x => x.id === giacenzaId);
                document.getElementById('modal-inv-lotto').value = g?.lotto || '';
                document.getElementById('modal-inv-scadenza').value = g?.scadenza || '';
                document.getElementById('modal-inv-quantita').value = g?.quantita ?? 0;
            } else {
                document.getElementById('modal-inv-lotto').value = '';
                document.getElementById('modal-inv-scadenza').value = '';
                document.getElementById('modal-inv-quantita').value = 0;
            }
            document.getElementById('modal-inventario-lotto').classList.remove('hidden');
        };

        window.chiudiModalInventario = () => {
            document.getElementById('modal-inventario-lotto').classList.add('hidden');
        };

        window.salvaInventarioLotto = async () => {
            const giacenzaId = document.getElementById('modal-inv-giacenza-id').value;
            const prodottoId = document.getElementById('modal-inv-prodotto-id').value;
            const p = prodotti.find(x => x.id === prodottoId);
            if (!p) return;
            const lotto = document.getElementById('modal-inv-lotto').value.trim().toUpperCase();
            const scadenza = document.getElementById('modal-inv-scadenza').value;
            const quantita = parseInt(document.getElementById('modal-inv-quantita').value) || 0;
            if (!lotto || !scadenza) return mostraNotifica('Compila lotto e scadenza');

            const dati = { idProdotto: prodottoId, nome: p.nome, lotto, scadenza, quantita };

            if (giacenzaId) {
                const altro = giacenze.find(g =>
                    g.id !== giacenzaId && g.idProdotto === prodottoId && g.lotto === lotto && g.scadenza === scadenza
                );
                if (altro && quantita > 0) {
                    const nuovaQta = altro.quantita + quantita;
                    await localUpdateGiacenza(altro.id, { quantita: nuovaQta });
                    await localDeleteGiacenza(giacenzaId);
                    if (isOnline && !isLocalId(altro.id)) {
                        await updateDoc(doc(db, "giacenze", altro.id), { quantita: nuovaQta });
                    } else if (!isLocalId(altro.id)) {
                        await enqueueOp({ type: 'updateGiacenza', id: altro.id, dati: { quantita: nuovaQta } });
                    }
                    if (isOnline && !isLocalId(giacenzaId)) {
                        await deleteDoc(doc(db, "giacenze", giacenzaId));
                    } else if (!isLocalId(giacenzaId)) {
                        await enqueueOp({ type: 'deleteGiacenza', id: giacenzaId });
                    }
                } else if (quantita <= 0) {
                    await localDeleteGiacenza(giacenzaId);
                    if (isOnline && !isLocalId(giacenzaId)) {
                        await deleteDoc(doc(db, "giacenze", giacenzaId));
                    } else if (!isLocalId(giacenzaId)) {
                        await enqueueOp({ type: 'deleteGiacenza', id: giacenzaId });
                    }
                } else {
                    await localUpdateGiacenza(giacenzaId, dati);
                    if (isOnline && !isLocalId(giacenzaId)) {
                        await updateDoc(doc(db, "giacenze", giacenzaId), dati);
                    } else if (!isLocalId(giacenzaId)) {
                        await enqueueOp({ type: 'updateGiacenza', id: giacenzaId, dati });
                    }
                }
            } else if (quantita > 0) {
                const esistente = giacenze.find(g => g.idProdotto === prodottoId && g.lotto === lotto && g.scadenza === scadenza);
                if (esistente) {
                    const nuovaQta = esistente.quantita + quantita;
                    await localUpdateGiacenza(esistente.id, { quantita: nuovaQta });
                    if (isOnline && !isLocalId(esistente.id)) {
                        await updateDoc(doc(db, "giacenze", esistente.id), { quantita: nuovaQta });
                    } else if (!isLocalId(esistente.id)) {
                        await enqueueOp({ type: 'updateGiacenza', id: esistente.id, dati: { quantita: nuovaQta } });
                    }
                } else {
                    const localId = await localAddGiacenza(dati);
                    if (isOnline) {
                        const ref = await addDoc(collection(db, "giacenze"), dati);
                        await idbDelete('giacenze', localId);
                        giacenze = giacenze.filter(g => g.id !== localId);
                        const newG = { ...dati, id: ref.id, _synced: true };
                        giacenze.push(newG);
                        await idbPut('giacenze', newG);
                    } else {
                        await enqueueOp({ type: 'addGiacenza', localId, dati });
                    }
                }
            }

            const eventoData = {
                tipo: 'INVENTARIO', idProdotto: prodottoId, nomeProdotto: p.nome,
                lotto, scadenza, quantita, nota: giacenzaId ? 'Modifica lotto inventario' : 'Nuovo lotto inventario'
            };
            if (isOnline) {
                await addDoc(collection(db, "eventi"), { ...eventoData, timestamp: Timestamp.now(), deviceId: DEVICE_ID });
            } else {
                await enqueueOp({ type: 'addEvento', dati: eventoData });
            }

            chiudiModalInventario();
            mostraNotifica(isOnline ? 'Inventario aggiornato' : 'Salvato offline ✓');
            renderGiacenze();
            renderInventario();
            aggiornaVistaOUT();
        };

        window.eliminaRigaInventario = async (giacenzaId) => {
            const confermato = await mostraConferma("Eliminare questo lotto dall'inventario?");
            if (!confermato) return;
            const g = giacenze.find(x => x.id === giacenzaId);
            await localDeleteGiacenza(giacenzaId);
            if (isOnline && !isLocalId(giacenzaId)) {
                await deleteDoc(doc(db, "giacenze", giacenzaId));
            } else if (!isLocalId(giacenzaId)) {
                await enqueueOp({ type: 'deleteGiacenza', id: giacenzaId });
            }
            const eventoData = {
                tipo: 'INVENTARIO', idProdotto: g?.idProdotto || null, nomeProdotto: g?.nome || '',
                lotto: g?.lotto || '', scadenza: g?.scadenza || null, quantita: 0,
                quantitaPrecedente: g?.quantita || 0, giacenzaId, nota: 'Eliminazione lotto'
            };
            if (isOnline) {
                await addDoc(collection(db, "eventi"), { ...eventoData, timestamp: Timestamp.now(), deviceId: DEVICE_ID });
            } else {
                await enqueueOp({ type: 'addEvento', dati: eventoData });
            }
            mostraNotifica('Lotto eliminato');
            renderGiacenze();
            renderInventario();
            aggiornaVistaOUT();
        };

        // ── Setup prodotti ────────────────────────────────────────────────────────
        function renderSetup() {
            const list = document.getElementById('setup-lista-prodotti');
            if (prodotti.length === 0) {
                list.innerHTML = '<li class="py-4 text-center text-gray-500">Nessun prodotto inserito</li>';
                return;
            }
            list.innerHTML = prodotti.map(p => `
                <li class="py-3 flex justify-between items-center gap-2">
                    <span class="font-bold flex-1 ${isLocalId(p.id) ? 'text-yellow-600' : ''}" id="setup-nome-${p.id}">${p.nome}${isLocalId(p.id) ? ' ⏳' : ''}</span>
                    <div class="flex gap-2">
                        <button onclick="modificaProdotto('${p.id}')" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg text-sm font-bold">Modifica</button>
                        <button onclick="eliminaProdotto('${p.id}')" class="bg-red-100 text-red-700 px-3 py-1 rounded-lg text-sm font-bold">Elimina</button>
                    </div>
                </li>
            `).join('');
        }

        window.modificaProdotto = (id) => {
            const p = prodotti.find(x => x.id === id);
            if (!p) return;
            document.getElementById('modal-prodotto-id').value = id;
            document.getElementById('modal-prodotto-nome').value = p.nome;
            document.getElementById('modal-modifica-prodotto').classList.remove('hidden');
        };

        window.chiudiModalModificaProdotto = () => {
            document.getElementById('modal-modifica-prodotto').classList.add('hidden');
        };

        window.salvaModificaProdotto = async () => {
            const id = document.getElementById('modal-prodotto-id').value;
            const p = prodotti.find(x => x.id === id);
            if (!p) return;
            const nuovoNome = document.getElementById('modal-prodotto-nome').value.trim().toUpperCase();
            if (!nuovoNome || nuovoNome === p.nome) { chiudiModalModificaProdotto(); return; }

            await localUpdateProdotto(id, nuovoNome);
            // Update giacenze locally
            const lottiProdotto = giacenze.filter(g => g.idProdotto === id);
            for (const g of lottiProdotto) {
                await localUpdateGiacenza(g.id, { nome: nuovoNome });
            }

            if (isOnline && !isLocalId(id)) {
                await updateDoc(doc(db, "prodotti", id), { nome: nuovoNome });
                for (const g of lottiProdotto) {
                    if (!isLocalId(g.id)) await updateDoc(doc(db, "giacenze", g.id), { nome: nuovoNome });
                }
            } else if (!isLocalId(id)) {
                await enqueueOp({ type: 'updateProdotto', id, nome: nuovoNome });
                for (const g of lottiProdotto) {
                    if (!isLocalId(g.id)) await enqueueOp({ type: 'updateGiacenza', id: g.id, dati: { nome: nuovoNome } });
                }
            }

            chiudiModalModificaProdotto();
            mostraNotifica(isOnline ? 'Prodotto modificato' : 'Salvato offline ✓');
            updateSelectProdotti();
            renderSetup();
            renderGiacenze();
            if (document.getElementById('section-inventario').classList.contains('active')) renderInventario();
        };

        window.eliminaProdotto = async (id) => {
            const p = prodotti.find(x => x.id === id);
            if (!p) return;
            const confermato = await mostraConferma(`Eliminare "${p.nome}" e tutte le giacenze associate?`);
            if (!confermato) return;

            const lottiProdotto = giacenze.filter(g => g.idProdotto === id);
            for (const g of lottiProdotto) {
                await localDeleteGiacenza(g.id);
                if (isOnline && !isLocalId(g.id)) {
                    await deleteDoc(doc(db, "giacenze", g.id));
                } else if (!isLocalId(g.id)) {
                    await enqueueOp({ type: 'deleteGiacenza', id: g.id });
                }
            }
            await localDeleteProdotto(id);
            if (isOnline && !isLocalId(id)) {
                await deleteDoc(doc(db, "prodotti", id));
            } else if (!isLocalId(id)) {
                await enqueueOp({ type: 'deleteProdotto', id });
            }

            mostraNotifica(isOnline ? 'Prodotto eliminato' : 'Eliminato offline ✓');
            updateSelectProdotti();
            renderSetup();
            renderGiacenze();
            aggiornaVistaOUT();
            if (document.getElementById('section-inventario').classList.contains('active')) renderInventario();
        };

        async function aggiungiProdotto() {
            const nome = document.getElementById('setup-nome-prodotto').value.trim().toUpperCase();
            if (!nome) return mostraNotifica('Inserisci un nome');

            const localId = await localAddProdotto(nome);

            if (isOnline) {
                const ref = await addDoc(collection(db, "prodotti"), { nome });
                // Replace local entry with real one
                prodotti = prodotti.filter(p => p.id !== localId);
                await idbDelete('prodotti', localId);
                const newP = { id: ref.id, nome, _synced: true };
                prodotti.push(newP);
                await idbPut('prodotti', newP);
                await addDoc(collection(db, "eventi"), { tipo: 'SETUP', nomeProdotto: nome, nota: 'Prodotto aggiunto', timestamp: Timestamp.now(), deviceId: DEVICE_ID });
            } else {
                await enqueueOp({ type: 'addProdotto', localId, nome });
                await enqueueOp({ type: 'addEvento', dati: { tipo: 'SETUP', nomeProdotto: nome, nota: 'Prodotto aggiunto' } });
            }

            document.getElementById('setup-nome-prodotto').value = '';
            mostraNotifica(isOnline ? 'Prodotto aggiunto' : 'Salvato offline ✓');
            updateSelectProdotti();
            renderSetup();
        }

        window.aggiungiProdotto = aggiungiProdotto;
    </script>
